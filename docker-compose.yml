services:
  telegram-bot:
    build: .
    container_name: ai-bengkel-bot
    restart: unless-stopped

    environment:
      - TELEGRAM_TOKEN=${TELEGRAM_TOKEN}
      - AUTHORIZED_USER_ID=${AUTHORIZED_USER_ID}
      - AI_PROVIDER=${AI_PROVIDER:-deepseek}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - DEEPSEEK_MODEL=${DEEPSEEK_MODEL:-deepseek-flash}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - OPENROUTER_CHAT_MODEL=${OPENROUTER_CHAT_MODEL}
      - OPENROUTER_VISION_MODEL=${OPENROUTER_VISION_MODEL}
      - DATABASE_URL=sqlite:///./data/workshop.db
      - APP_HOST=${APP_HOST:-127.0.0.1}
      - APP_PORT=${APP_PORT:-8000}
      - BOT_DATA_FILE=/app/data/bot_data.pickle

    volumes:
      - bot-data:/app/data

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  bot-data:

